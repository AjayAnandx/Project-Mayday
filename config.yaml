ollama:
  api_key: ""  # Leave empty for local Ollama
  model: gemma4:31b-cloud
  endpoint: http://localhost:11434/v1/chat/completions
  timeout: 600  # Read timeout in seconds (large research/build prompts need longer)
  keep_alive: -1  # Pin models in VRAM (-1 = forever, 0 = unload, 300 = 5 min). Avoids reload stalls.

# Two-tier model architecture:
#   interactive = local small model (llama3.2:3b) that talks to the user and humanizes answers
#   worker      = capable model (gemma4:31b-cloud) that does the heavy tool/reasoning work
# Falls back to the `ollama` block above when a tier is omitted.
models:
  interactive:
    model: llama3.2:3b
    endpoint: http://localhost:11434/v1/chat/completions
    api_key: ""
  worker:
    model: gemma4:31b-cloud
    endpoint: http://localhost:11434/v1/chat/completions
    api_key: ""
  tiering_enabled: false  # SINGLE-LLM mode: one cloud model handles everything (no slow local interactive tier)
  humanize_enabled: false  # skip the redundant humanize pass (was a slow CPU-bound local call)

# Unified LLM gateway: OpenAI + Ollama Local + Ollama Cloud + OpenRouter behind one
# OpenAI-compatible interface (backend/assistant/providers/). The worker tier
# defaults to OpenAI and fails over automatically on 401/402/429/5xx,
# timeouts and connect errors. Interactive tier stays local (fast, free).
# Without this `providers:` block the gateway preserves the old
# single-provider behavior (everything from the `ollama:` block).
providers:
  default: openai                    # worker primary: openai | openrouter | ollama_cloud | ollama_local
  interactive: ollama_local              # interactive tier: always local (never uses tools)
  fallback_order: [openai, openrouter, ollama_cloud, ollama_local]
  max_tools: 100                          # hard cap per LLM call (OpenAI/OpenRouter reject >128; 100 leaves headroom for skill tools)
  free_max_iterations: 20                 # parity with local loop budget (lower to save free-tier quota)

openai:
  endpoint: https://api.openai.com/v1/chat/completions
  model: gpt-4o-mini
  api_key: ""  # Set via OPENAI_API_KEY env var or .env

# OpenAI Realtime API — interactive voice agent (low-latency speech-to-speech).
# Stage 1 (Hybrid): browser ↔ FastAPI WS relay (/api/realtime/voice) ↔ OpenAI.
#   The long-lived OPENAI_API_KEY never leaves the server; the browser only
#   speaks to our relay. Stage 2 (later): WebRTC direct + sideband ?call_id=.
#   Interactive handles simple single-tool turns; heavy multi-step work is
#   escalated to the background worker (existing _run_engine tool loop).
#   Fallback when unreachable/key missing: text-only chat (no Deepgram path).
realtime:
  enabled: true
  model: gpt-realtime-2.1
  voice: marin
  relay_only: true  # true = WS relay only; false = also allow WebRTC direct
  max_minutes_per_session: 15
  vad_threshold: 0.65
  vad_silence_duration_ms: 600
  vad_prefix_padding_ms: 200
  api_key: ""  # Set via OPENAI_API_KEY env var or .env (shares openai key)

ollama_cloud:
  endpoint: https://api.ollama.com/v1/chat/completions
  model: gemma4:31b-cloud
  api_key: ""  # Set via OLLAMA_API_KEY env var or .env

openrouter:
  endpoint: https://openrouter.ai/api/v1/chat/completions
  model: nvidia/nemotron-3-super-120b-a12b:free
  api_key: ""  # Set via OPENROUTER_API_KEY env var or .env
  title: "Mayday"                        # X-OpenRouter-Title attribution header
  referer: ""                            # optional HTTP-Referer (rankings)
  provider:                              # OpenRouter routing prefs
    require_parameters: true             # only tool-capable endpoints for tool turns
    allow_fallbacks: true

# MAGMA multi-graph memory substrate (R2+). Additive; retrieval stays on the
# flat graph until R3 wires it into the engine. Local embedder is a stand-in
# for an Ollama embedding model (swap _LocalEmbedder._embed later).
memory:
  # Brain V2 P2: knowledge graph persisted in SQLite (brain.db, WAL). On the first
  # start it imports memory_graph.json once and never writes the JSON again.
  # Roll back: set backend: json (the JSON file is the pre-migration state;
  # export the current graph first with python -m backend.brain.cli export).
  backend: sqlite
  db_path: brain.db

brain:
  # Brain V2 P3: after each non-trivial user turn, ONE worker-model call proposes
  # facts / commitments / ideas / aliases, each with a verbatim quote. The validator
  # checks the quote is in the message. >= auto_threshold is written, >= ask_threshold
  # waits in the Learned feed (Brain tab) for confirmation, lower is dropped.
  capture:
    enabled: true
    auto_threshold: 0.8
    ask_threshold: 0.5
    max_ops: 8
  # Brain V2 P4: "Relevant memories" = FTS5 BM25 + IDF search + local embeddings
  # + graph neighbours, fused (RRF), with pronouns resolved from recent messages.
  # enabled: false falls back to MAGMA.
  recall:
    enabled: true
    token_budget: 1200        # max tokens of memories per turn
    max_items: 8
    use_embeddings: true
    embed_model: nomic-embed-text
    embed_url: http://localhost:11434/api/embed
    embed_timeout: 3.0
  # Brain V2 P5: per turn, the routed tools are ordered by relevance and capped at
  # max_tools; the model can fetch others with the tool_search meta-tool. Names or
  # pronouns in gmail_send/gmail_draft "to" are resolved from memory/Planner people.
  # Each turn's offered/used/searched tools go to brain.db tool_log
  # (GET /api/brain/tools/stats).
  tools:
    enabled: true
    max_tools: 30
    search_k: 6
    exempt_intents: [build]   # autonomous builds keep the full routed set
    log: true
  # Brain V2 P6: nightly at nightly_at: fix contradictions, expire unreviewed pending
  # items, merge duplicates, summarise the last days' conversations into episodes
  # (1 worker call per day). Weekly (weekly_day, 0=Mon..6=Sun): evidence-cited persona
  # shown in the profile. Open loops appear in the morning digest.
  # Brain V3 P8: sensory layer. Signals go to brain.db `signals` (raw, retention_days)
  # and `signal_stats` (hourly roll-ups). Window titles, URLs, text and coordinates are
  # never stored. The desktop sensor runs in your user session:
  #   scripts/install_brain_sensor.ps1  (Task Scheduler, at logon)
  sensors:
    enabled: true
    pause: false            # true = stop all sensing
    desktop: true           # app category + switches + idle/lock (no titles)
    ui: true                # response latency, dismissals, edits, tab visibility
    location: false         # phone/browser location -> place label (opt-in)
    retention_days: 14
    backend_url: http://127.0.0.1:8771
    categories: {}          # extra exe -> category, e.g. {code: [rider64.exe]}
  # Brain V3 P9: habits mined nightly (>= min_count times across >= min_weeks weeks);
  # decay archives weak, unconnected, unconfirmed generic memories (restorable for archive_days).
  habits:
    min_count: 3
    min_weeks: 2
    lookback_days: 42
  decay:
    enabled: true
    floor: 0.08
    max_archive_per_night: 200
    archive_days: 90
  # Brain V3 P10: lessons from mistakes (frustrated/correcting turns, repeated tool errors).
  # One worker call per mistake, capped per day; active after a 2nd occurrence or your OK.
  lessons:
    enabled: true
    max_per_day: 6
    min_dissatisfaction: 0.5
    inject: 3                # top relevant lessons added to the prompt
  # Brain V3 P11: decision gate + graduated agency. dial: off | quiet (1/day) | balanced (3/day)
  # | eager (6/day); the Brain tab can override it. Autonomous actions only for pre-authorised,
  # reversible, internal kinds (never send/pay/book/delete); Undo for 7 days.
  proactive:
    enabled: true
    dial: balanced
    quiet_hours: "22:30-07:00"
    urgent_cap: 3
    cooldown_min: 30
    preauthorized: [planner_move_own_block]
    earned_autonomy_after: 5
    min_sample: 0.2          # Thompson-sampled acceptance below this -> morning digest
  # Brain V3 P12: 72-hour look-ahead (conflicts, overload, unscheduled important tasks,
  # missing prep before exams/interviews/pitches, overdue waiting-on) and prep packs
  # (one worker call per event/exam/deadline, every line cited, max_per_day).
  friction:
    horizon_hours: 72
    focus_factor: 0.6
    default_task_min: 45
    important_priority: 2
  prep:
    enabled: true
    lead_hours: 18
    show_before_min: 30
    max_per_day: 3
    use_gmail: true
  # Brain V3 P13: latent goals (1 worker call at most every min_interval_h, max_per_day)
  # and a state estimate (focus/load/fatigue/stress vs YOUR baseline; adapts tone and timing,
  # never labels you; correct it in Brain -> Thoughts).
  intents:
    enabled: true
    min_interval_h: 2
    max_per_day: 4
    decay: 0.85
    working_p: 0.8
    drop_p: 0.2
  state:
    enabled: true
    min_baseline_days: 7
    cache_s: 60
  # Brain V3 P14 (nightly): drift (your rhythms vs 4 weeks before; stale goals/values asked),
  # routines (repeated multi-tool tasks -> named, verified workflows; offered at their usual
  # time) and curiosity (recurring new topics -> quick research, max_per_day).
  drift:
    enabled: true
    window_weeks: 4
    js_threshold: 0.2
    min_events: 20
    stale_days: 45
  routines:
    enabled: true
    min_count: 3
    min_days: 2
    lookback_days: 42
    max_induce_per_night: 2
  curiosity:
    enabled: true
    max_per_day: 2
    lookback_days: 14
  timing:
    focus_minutes: 20       # one work category for this long = deep focus
    focus_share: 0.75
    max_switches_per_min: 1.5
    idle_minutes: 5
    session_gap_minutes: 15 # away this long -> "back after a break" transition
  reflection:
    enabled: true
    nightly_at: "03:00"
    weekly_day: 6
    pending_days: 14
    max_day_chars: 12000
    skip_pattern: '\bZZTEST|\bZZTester'   # conversations from scripted smoke tests

magma:
  enabled: true
  vector_dim: 1024
  semantic_threshold: 0.55
  beam_width: 20
  token_budget: 4000
  # Slow-path consolidation (R4): worker model infers latent causal/entity edges
  # for un-consolidated nodes, asynchronously, off the response path.
  # Disabled by Brain V2 P6: it spent up to 20 worker calls per turn linking
  # bookkeeping nodes; brain.reflection does nightly consolidation instead.
  consolidation_enabled: false
  consolidation_batch: 20

# DSPy (R5): compiles the interactive tier's HumanSynthesizer + IntentRouter on
# the local 0.5b model. Master kill-switch off by default; when enabled, the
# dspy path replaces the hand-written few-shot prompts in tiers.py and falls
# back to them on any error. Artifacts in backend/dspy/artifacts (PII-gated).
music:
  cookies_file: ""  # optional path to YouTube cookies.txt for yt-dlp (429 / "Sign in to confirm" bypass)
  history_path: music_history.json
  # ytmusicapi is unauthenticated; yt-dlp is open-source. No API keys.
  # Startup logs yt-dlp --version + ytmusicapi version; audio-only fallback accepted when progressive unavailable.

data:
  storage_path: data.json
  projects_dir: C:\Users\hp\Projects\madays projects
  research_path: C:\Users\hp\Projects\Mayday Research\research.json
  research_outputs_dir: C:\Users\hp\Projects\Mayday Research\topics

# Evidence-based research runs (backend/core/research_flow.py).
# Flow: scope → plan → gather → extract → verify → synthesize → review → deliver.
research:
  budget:                     # default per run; research_start can override each value
    max_minutes: 10
    max_sources: 40
    max_cost_usd: 0.5
  models:                     # cheap model for bulk extraction, stronger one for judgement
    scope: gpt-4o-mini
    extract: gpt-4o-mini
    synthesize: gpt-4o
    review: gpt-4o
  pricing:                    # USD per 1M tokens [input, output], used for the cost budget
    gpt-4o-mini: [0.15, 0.6]
    gpt-4o: [2.5, 10.0]
  limits:
    queries_per_question: 2
    results_per_query: 6
    fetch_chars: 20000        # full text saved per source
    extract_chars: 12000      # text sent to the extractor per source
    claims_per_source: 8
    min_sources: 4            # gather gate
    min_domains: 2            # gather gate
    synthesis_claims: 120
    review_loops: 1           # extra gather→synthesize rounds driven by the reviewer
    workers: 4
  # Stage + category playbooks live in backend/research_playbooks (see its README).
  # Skills add named sections only ("skill#Section|Section"); a whole skill is never injected.
  skills:
    plan: "deep-research#Critical rules|Pitfalls"
    synthesize: "deep-research#Critical rules|Pitfalls"
  # Contact URL sent in the User-Agent to Wikipedia/Crossref/PubMed (their API etiquette).
  # Use a page you control; no personal details are sent unless you put them here.
  contact_url: "https://github.com/"
  # Extra search sources backed by MCP servers from the mcp: section below.
  mcp_adapters:
    github_repos:
      enabled: false          # turn on after refreshing GITHUB_PERSONAL_ACCESS_TOKEN (currently 401)
      server: github
      tool: search_repositories
      query_arg: query
      limit_arg: perPage
      type: web
      description: "Open-source repositories on GitHub (stars, activity). Use for technical research on tools and libraries."

server:
  host: 0.0.0.0
  port: 8771

personality:
  name: "Mayday"
  user_name: ""
  default_tone: "warm, empathetic, and human — like a caring close friend"
  traits:
    - "empathetic and emotionally intelligent"
    - "speaks naturally, like a real person (contractions, warmth)"
    - "concise but thorough"
    - "proactive with suggestions"
    - "adapts tone based on user feedback"
  rules:
    - "Address the user by name when known"
    - "Acknowledge personal or emotional shares with genuine warmth"
    - "Confirm what you've learned or stored in a natural, human way"
    - "Avoid robotic or corporate phrasing"
    - "Explain tool actions briefly and in plain language"
    - "Be a genuine friend, not a therapist, life-coach, or support agent"
    - "Skip reassurance monologues; show care through small, natural words and actions"
    - "Keep replies short and real — don't deliver caring speeches or announce your support abstractly"

voice:
  enabled: true
  deepgram_api_key: ""  # Set via DEEPGRAM_API_KEY env var or .env
  stt_model: nova-2
  tts_voice: aura-asteria-en
  tts_speed: 1.0
  sample_rate: 16000

location:
  default_location: ""

skills:
  enabled: true
  directory: C:\Users\hp\agent-skills\skills

projects:
  trust: medium  # graduated trust: low | medium | high (C2)
  artifact_threshold: 2000
  append_only_hot_path: false

sandbox:
  enabled: true
  image: mayday-sandbox:latest
  build_from: docker/Dockerfile
  volume_driver: local

mcp:
  servers:
    git:
      command: .\\venv\\Scripts\\python.exe
      args: ["-m", "mcp_server_git", "-r", "."]
      lazy: true
    github:
      command: backend\bin\github-mcp-server.exe
      args: ["stdio", "--toolsets", "repos,context"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: ""  # Set via GITHUB_PERSONAL_ACCESS_TOKEN env var or .env
    exa:
      command: npx
      args: ["-y", "exa-mcp-server"]
      env:
        EXA_API_KEY: ""  # Set via EXA_API_KEY env var or .env
      lazy: true
    fetch:
      command: uvx
      args: ["mcp-server-fetch"]
      lazy: true
    opencode:
      command: .\\venv\\Scripts\\python.exe
      args: ["-m", "backend.assistant.mcp_server_opencode"]
      lazy: true
    ui-layouts:
      command: npx
      args: ["@ui-layouts/mcp"]
      lazy: true
    magic-ui:
      command: npx
      args: ["-y", "@magicuidesign/mcp@latest"]
      lazy: true
    playwright:
      command: npx
      args: ["@executeautomation/playwright-mcp-server"]
      lazy: true
    firecrawl:
      command: npx
      args: ["-y", "firecrawl-mcp"]
      env:
        FIRECRAWL_API_KEY: ""  # Set via FIRECRAWL_API_KEY env var or .env
      lazy: true

# DSPy research modules (Modules A + B) — flag-gated, additive, default-off.
# Nothing uses DSPy unless enabled:true AND the relevant module flag is true.
dspy:
  enabled: true                 # master kill-switch
  interactive_tier: true        # use compiled HumanSynthesizer + IntentRouter on 3B
  research_synthesis: false     # Module A — report synthesis
  research_agent: false         # Module B — RL multi-hop research agent
  model: ""                     # empty = reuse ollama.model (local-first)
  reflection_model: ""          # empty = local; set to cloud URI = opt-in delegation
  max_hops: 12                  # Module B hop budget
  max_iters_report_sections: 2  # Module A ChainOfThought depth for synthesis
  artifacts_dir: dspy_artifacts  # compiled prompts/demos (gitignored; PII-gated)
  # Module C — User Awareness + Personal Task Store (UA-1..UA-6, PTS-1)
  ua1_extractor: false
  ua2_confidence: false
  ua3_ask_policy: false
  ua4_reflector: false
  ua5_gate: false               # GatePolicy — the starred, pilot module
  ua6_snapshot: false
  pts1_interpreter: false

# User Awareness engine — onboarding questions + proactive follow-ups only.
# Personal facts now live in the shared knowledge graph (single source of truth)
# via remember(); the separate belief store / user_profile.json was removed.
awareness:
  enabled: true
  max_daily_questions: 3
  proactive_followups: true    # auto check in on learned loved ones ("what about her?")
  followup_cadence_days: 7      # days between gentle follow-ups about a person
  brief_enabled: true          # build aggregated per-person briefs
  soft_signal_threshold: 2      # mentions required before persisting soft/implicit facts

# PHF-Mini: compact hierarchical user model (Practice -> Habitus -> Field) from
# 2606.md. Reuses QueryClassifier intents + graph node-types as the practice
# codebook; HabitusBuilder aggregates practice signals with sqrt-recency. No
# model training. Disabled = context section omitted and practice logging skipped.
telegram:
  enabled: true
  token: ""                 # set via TELEGRAM_BOT_TOKEN env var or .env
  allowed_chat_ids: []      # numeric chat ids; empty = no one (fail closed) — after /start, put your chat_id here
  search_dirs: []           # optional; defaults to pdfs/ + projects_dir + research_outputs_dir + uploads/
  chart_png_dir: uploads    # temp PNG output
  verbose_tools: false      # when true, every tool_call (list_*, search_*) is echoed as 🛠 message; false = silent (only files/charts/errors)

openalex:
  api_key: ""  # Set via OPENALEX_API_KEY env var or .env (get from https://openalex.org/api)

maps:
  enabled: true
  api_key: ""  # Set via GOOGLE_MAPS_API_KEY env var or .env (restricted to Places New + Routes + Geocoding + Address Validation + Time Zone)
  home: ""  # set MAYDAY_HOME_ADDRESS in .env (kept out of the public repo)
  home_latlng: ""  # filled by validate step, e.g. "13.0282,80.2102" — avoids a geocode call per route
  work: ""
  work_latlng: ""
  default_modes: [drive, two-wheeler]  # travel modes Mayday compares (drive | two-wheeler | transit | walk)
  avoid: []                            # e.g. [tolls, highways] passed to Routes
  cache_ttl_hours: 24

planner:
  # Mayday V2 Planner — unified tasks / events / reminders / waiting-on (data in planner/)
  app_url: "http://localhost:8771"   # link used in digest emails
  nudge_signature: "Thanks"          # sign-off on drafted follow-up emails (drafts only, never auto-sent)
  digest:
    enabled: true
    morning: "07:30"                 # today's plan: schedule, due, overdue, follow-ups, top 3
    evening: "21:00"                 # day review: done, carried over, tomorrow, waiting on
    to: ""                           # your address; empty = gmail.user_email

gmail:
  enabled: true
  account: both                  # agent | user | both (both = watch personal inbox too)
  agent_email: "maydayishereatwork@gmail.com"
  user_email: ""                 # your personal Gmail (login_hint + identity check for the user slot)
  scopes_agent: gmail.modify     # modify | readonly
  scopes_user: gmail.readonly    # personal slot is ALWAYS readonly — Mayday can never send/mark personal mail
  credentials_path: backend/credentials/gmail_credentials.json
  token_path_agent: tokens/agent_token.json
  token_path_user: tokens/user_token.json
  polling_interval: 60
  redirect_uri: http://localhost:8771/api/auth/gmail/callback  # service port; loopback port is followed automatically in dev (8772)
  watch_enabled: false           # v2 only (Pub/Sub)
  auto_reply: false              # approval-gated: draft only until user says approve/send
  ui_mode: minimal

phf:
  enabled: true
  practice_log: practices.jsonl
  habitus_path: habitus.json
  recency_halflife_weeks: 4    # sqrt-decay half-life for practice signals
  top_traits: 8                # how many habitus dimensions to surface in context


